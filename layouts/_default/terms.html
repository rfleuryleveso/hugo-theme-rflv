{{ define "main" }}
{{ partial "breadcrumb.html" . }}

<div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
  <div class="pb-6 mb-8 border-b-2 border-gray-900">
    <h1 class="text-3xl font-black text-gray-900">{{ .Title }}</h1>
  </div>

  <div class="flex flex-wrap gap-2">
    {{- range .Data.Terms.ByCount }}
    <a href="{{ .Page.Permalink }}"
       class="inline-flex items-center gap-2 px-3 py-1.5 text-sm font-semibold
              bg-gray-100 text-gray-700 hover:bg-red-700 hover:text-white transition-colors">
      {{ .Page.Title }}
      <span class="font-mono text-xs opacity-60">{{ .Count }}</span>
    </a>
    {{- end }}
  </div>
</div>
{{ end }}

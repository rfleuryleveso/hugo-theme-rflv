<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}

  <main class="site-main" id="main-content">
    <div class="container">
      <div class="error-page">
        <div class="error-page__code">404</div>
        <h1 class="error-page__title">Page Not Found</h1>
        <p class="error-page__desc">
          The document you requested could not be located in the database.<br>
          It may have been moved, removed, or the URL may be incorrect.
        </p>
        <div style="display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;">
          <a class="btn btn--primary" href="{{ .Site.BaseURL }}">Return Home</a>
          <a class="btn btn--outline" href="{{ "/publications/" | relURL }}">Browse Publications</a>
          <a class="btn btn--ghost" href="{{ "/posts/" | relURL }}">Browse Articles</a>
        </div>
      </div>
    </div>
  </main>

  {{ partial "footer.html" . }}
</body>
</html>

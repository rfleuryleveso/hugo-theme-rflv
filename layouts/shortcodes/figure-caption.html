{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $caption := .Get "caption" | default "" -}}
{{- $width := .Get "width" | default "100%" -}}
<figure style="text-align:center;margin:1.5rem 0;">
  <img src="{{ $src | relURL }}" alt="{{ $alt }}" style="max-width:{{ $width }};border:1px solid var(--ieee-border);border-radius:var(--radius);">
  {{- with $caption }}
  <figcaption>{{ . | markdownify }}</figcaption>
  {{- end }}
</figure>

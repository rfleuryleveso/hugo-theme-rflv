{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $caption := .Get "caption" | default "" -}}
{{- $width := .Get "width" | default "100%" -}}
<figure class="not-prose my-8 text-center">
  <img src="{{ $src | relURL }}"
       alt="{{ $alt }}"
       class="border border-gray-200 mx-auto"
       style="max-width:{{ $width }}">
  {{- with $caption }}
  <figcaption class="mt-2 text-xs text-gray-500 italic">{{ . | markdownify }}</figcaption>
  {{- end }}
</figure>

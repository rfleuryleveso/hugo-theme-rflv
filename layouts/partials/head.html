<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">

{{- $title := cond .IsHome .Site.Title (printf "%s | %s" .Title .Site.Title) }}
<title>{{ $title }}</title>

{{- with .Description }}<meta name="description" content="{{ . }}">
{{- else }}<meta name="description" content="{{ .Site.Params.description }}">{{ end }}
{{- with .Params.authors }}<meta name="author" content="{{ delimit . ", " }}">
{{- else }}<meta name="author" content="{{ .Site.Params.author }}">{{ end }}

<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:type"  content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:url"   content="{{ .Permalink }}">
{{- with (.Params.featured_image | default .Site.Params.ogImage) }}
<meta property="og:image" content="{{ . | absURL }}">
{{- end }}

<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">

<!-- Google Fonts: Inter (Open Sans equivalent) + JetBrains Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- Tailwind CSS CDN (includes Typography plugin) -->
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'Open Sans', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', '"Fira Code"', 'ui-monospace', '"Courier New"', 'monospace'],
        },
        colors: {
          'ieee-red':   '#c8102e',
          'ieee-black': '#0a0a0a',
          'ieee-blue':  '#00629b',
        },
      },
    },
  }
</script>

<!-- Theme component classes (custom CSS, not covered by Tailwind utilities) -->
<link rel="stylesheet" href="{{ "css/theme.css" | relURL }}">

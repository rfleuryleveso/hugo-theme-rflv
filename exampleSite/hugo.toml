baseURL = "https://example.com/"
languageCode = "en-us"
title = "Spectrum"
theme = "hugo-theme-rflv"

enableRobotsTXT = true
enableEmoji     = false

# Required for Tailwind CSS class detection
[build]
  writeStats = true

[[build.cachebusters]]
  source = "hugo_stats\\.json"
  target = "css"

[[build.cachebusters]]
  source = "assets/css/main\\.css"
  target = "css"

[pagination]
  pagerSize = 12

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style        = "dracula"
    lineNos      = false
    guessSyntax  = true
    noClasses    = true

[params]
  description = "Embedded software engineer specialising in real-time systems, firmware, and hardware-software co-design."
  author      = "R. Fleury-Leveso"
  role        = "Embedded Software Engineer"
  email       = "r.fleuryleveso@example.com"
  github      = "rfleuryleveso"
  linkedin    = "rfleuryleveso"
  orcid       = "0000-0000-0000-0000"

  # Two-part header branding: "<brandPrefix> / <title>"
  brandPrefix = "IEEE"

  bio = "I build firmware and real-time systems for resource-constrained hardware — RTOS scheduling, hardware-software co-design, and formal verification of safety-critical code."

  yearsExperience = 5

  # Uncomment to show an avatar in the hero
  # avatarImage = "img/avatar.jpg"

  # Link shown as a red CTA button in the header
  # cvLink = "files/cv.pdf"

  # Google Scholar
  # googleScholar = "https://scholar.google.com/citations?user=XXXX"

  license = "Content licensed under CC BY 4.0"

[taxonomies]
  tag      = "tags"
  category = "categories"

# ── Navigation (topic-based, IEEE Spectrum style) ─────────────
[[menus.main]]
  name   = "Embedded"
  url    = "/posts/"
  weight = 1

[[menus.main]]
  name   = "Hardware"
  url    = "/projects/"
  weight = 2

[[menus.main]]
  name   = "Research"
  url    = "/publications/"
  weight = 3

[[menus.main]]
  name   = "About"
  url    = "/about/"
  weight = 4
